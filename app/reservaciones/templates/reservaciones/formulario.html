<!DOCTYPE html>
<html>
<head><title>Nueva Reservación</title></head>
<body>
    <h1>Nueva Reservación</h1>
    
    {% if messages %}
        {% for message in messages %}
            <div style="color: red;">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Guardar</button>
    </form>
    <a href="{% url 'lista_reservaciones' %}">Volver</a>
</body>
</html>
