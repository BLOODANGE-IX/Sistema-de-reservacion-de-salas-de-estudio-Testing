<!DOCTYPE html>
<html>
<head><title>Mis Reservaciones</title></head>
<body>
    <h1>Mis Reservaciones</h1>
    <a href="{% url 'crear_reservacion' %}">Nueva Reservación</a>
    <ul>
        {% for reserva in reservaciones %}
            <li>
                {{ reserva.sala.nombre }} - {{ reserva.fecha }} 
                ({{ reserva.hora_inicio }} a {{ reserva.hora_fin }}) 
                [{{ reserva.estado }}]
                
                {% if reserva.estado == 'VIGENTE' %}
                    <form action="{% url 'cancelar_reservacion' reserva.pk %}" method="post" style="display:inline;">
                        {% csrf_token %}
                        <button type="submit" onclick="return confirm('¿Seguro que deseas cancelar?')">Cancelar</button>
                    </form>
                {% endif %}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
